org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Debug builds only: a default PC for when the module's settings screen is empty.
# "host[:firstPort];host2", host = Tailscale IP or MagicDNS name, firstPort = DesktopConnectNative's
# "Port" setting (default 9000). Put your own value in ts.properties (not in git) as tsHosts=...,
# or pass -PtsHosts=... Release builds ship no default.
tsHosts=see ts.properties
